itemDescs = { base = 0x087EE1C8, stride = 0x28, descOff = 0x14, count = 821 }
playerParty = 0x02025038
playerPartyCount = 0x02025035
objectEvents = 0x020383F0
mapHeader = 0x020383B8
bagPockets = 0x0203AEC0
bagPocketCount = 5
bagPocketOrder = 'EMERALD_BAG_POCKET_ORDER'
battleTypeFlags = 0x02024A5C
battlersCount = 0x02024AD8
battlerPartyIndexes = 0x02024ADA
battlerPositions = 0x02024AE2
battleMons = 0x02024AF0
battleStructPtr = 0x02024F9C
# gActionSelectionCursor / gMoveSelectionCursor, +0x10 / +0x14 past the gBattleStruct pointer (v1.3 / v1.2.2 / v1.2.1). Checked
# headless: RIGHT / DOWN walk 0 -> 1 -> 3, a written 2 + A opens the party menu, a written move 1 + A spends its PP.
actionCursor = 0x02024FAC
moveCursor = 0x02024FB0
monToSwitchIntoOff = 0x3C
enemyParty = 0x020254E8
handleInputChooseAction = 0x0807AA19
handleInputChooseMove = 0x0807B541
completeWhenChoseItem = 0x0807D165
waitForMonSelection = 0x0807D0AD
handleInputChooseTarget = 0x0807ADCD
partyMenu = 0x0203DFB0
monIconTable = 0x087DE064
monIconPaletteIndices = 0x087E0C34
monIconPaletteTable = 0x087E159C
itemIconTable = 0x088A85A0
pokedex = 'POKEDEX_MARIOMON_V1_3'
guideTables = 'GUIDE_TABLES_MARIOMON_V1_3'

